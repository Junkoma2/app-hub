<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app hub</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F59E0B" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="home-page">
      <section class="intro">
        <h1>app hub</h1>
        <p>作ったアプリをまとめています。</p>
      </section>

      <section class="featured-projects" aria-label="作ったアプリ">
        <h2>apps</h2>
        <a
          class="project-card"
          href="https://junkoma2.github.io/habit-tracker/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/habit-tracker/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">habit tracker</span>
            <span class="project-note">習慣を記録して継続をサポート</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/task-manager/"

          <img class="project-icon" src="https://junkoma2.github.io/task-manager/icon.svg" alt="" width="48" height="48" />

            <span class="project-name">task manager</span>
            <span class="project-note">タスクを整理して管理</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/word-list/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/word-list/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">word list</span>
            <span class="project-note">分からない単語をすぐ保存</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/gather/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/gather/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">gather</span>
            <span class="project-note">アイデアや思考をその場でメモ</span>
          </span>
        </a>
      </section>

      <a class="projects-link" href="./projects.html">→ すべてのアプリ</a>
