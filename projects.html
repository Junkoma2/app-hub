<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>apps - app hub</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F59E0B" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="projects-page">
      <h1>apps</h1>

      <section class="projects-list" aria-label="作成したアプリ">
        <a
          class="project-card"
          href="https://junkoma2.github.io/habit-tracker/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/habit-tracker/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">habit tracker</span>
            <span class="project-note">毎日の習慣にチェックを入れて継続を記録する</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/task-manager/"
        >
          <img class="project-icon" src="./assets/task-manager.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">task manager</span>
            <span class="project-note">やることを追加して子タスクに分解する</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/word-list/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/word-list/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">word list</span>
            <span class="project-note">分からなかった単語をタグ付きで残す</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/gather/"
        >
          <img class="project-icon" src="https://junkoma2.github.io/gather/icon.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">gather</span>
            <span class="project-note">思考を円で置いて、近さで関係を眺める</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/renda-dojo/"
        >
          <img class="project-icon" src="./assets/renda-dojo.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">連打道場</span>
            <span class="project-note">10秒間で何回タップできるか挑戦</span>
          </span>
        </a>
        <a
          class="project-card"
          href="https://junkoma2.github.io/kakkoii-login/"
        >
          <img class="project-icon" src="./assets/kakkoii-login.svg" alt="" width="48" height="48" />
          <span class="project-copy">
            <span class="project-name">かっこよくログインしたい</span>
            <span class="project-note">ハッカー風ログイン演出デモ</span>
          </span>
        </a>
      </section>

      <a class="back-link" href="./index.html">ホーム</a>
      <p class="app-version">バージョン <span data-app-version></span></p>
    </main>
    <script src="./version.js"></script>
  </body>
</html>
